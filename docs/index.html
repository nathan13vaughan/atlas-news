<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas News</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- iOS PWA installability -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas News">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-bar">
  <div class="title"><span class="dot" id="dot">●</span>ATLAS NEWS</div>
  <div class="updated" id="updated">loading…</div>
</header>

<div class="chips" id="chips"></div>

<div class="blackout" id="blackout" hidden>
  <div class="led"></div>
  <div>
    <div class="b-title">IN BLACKOUT</div>
    <div class="b-sub" id="blackoutSub"></div>
  </div>
</div>

<div class="pricestrip" id="pricestrip"></div>
<div class="pricestrip-meta" id="pricestripMeta">loading prices…</div>

<div class="hero" id="hero" hidden>
  <div class="kicker">Next event</div>
  <div class="event" id="heroTitle"></div>
  <div class="countdown" id="countdown"></div>
  <div class="badges" id="heroBadges"></div>
</div>

<div class="section-h">Upcoming · 7 days · AEST</div>
<div class="list" id="list"></div>

<div class="sheet" id="sheet" hidden>
  <div class="grabber"></div>
  <h3 id="sheetTitle"></h3>
  <div class="meta" id="sheetMeta"></div>
  <div class="kv" id="sheetKv"></div>
</div>
<div class="dim-overlay" id="overlay" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
