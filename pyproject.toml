[project]
name = "atlas-news"
version = "0.1.0"
description = "Live prices + macro/earnings calendar PWA for a 7-ticker watchlist."
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "requests>=2.31",
    "lxml>=5.0",            # required by yfinance.Ticker.earnings_dates
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_news"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
